{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <link rel="stylesheet"
          href="{% static 'css/auth.css' %}">

</head>

<body>

<div class="auth-page">

    <!-- LEFT SIDE -->

    <div class="left-panel">

        <h1>
            Welcome Back
        </h1>

        <p>
            Login to continue tracking your
            expenses smarter and better.
        </p>

    </div>


    <!-- RIGHT SIDE -->

    <div class="right-panel">

        <div class="auth-card">

            <h2>Login</h2>

            <form method="POST">

                {% csrf_token %}

                <input type="text"
                       name="username"
                       placeholder="Username"
                       required>

                <input type="password"
                       name="password"
                       placeholder="Password"
                       required>

                <button type="submit">
                    Login
                </button>

            </form>

            <a href="#" class="forgot-link">
                Forgot Password?
            </a>

            <div class="bottom-text">

                Don't have an account?

                <a href="{% url 'register' %}">
                    Create Account
                </a>

            </div>

        </div>

    </div>

</div>

</body>
</html>
