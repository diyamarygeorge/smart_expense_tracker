{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Create Account</title>

    <link rel="stylesheet"
          href="{% static 'css/auth.css' %}">

</head>

<body>

<div class="auth-page">

    <!-- LEFT SIDE -->

    <div class="left-panel">

        <h1>
            Smart Expense Tracker
        </h1>

        <p>
            Create your account and start
            managing your finances beautifully.
        </p>

    </div>


    <!-- RIGHT SIDE -->

    <div class="right-panel">

        <div class="auth-card">

            <h2>Create Account</h2>

            <form method="POST">

                {% csrf_token %}

                <input type="text"
                       name="username"
                       placeholder="Username"
                       required>

                <input type="email"
                       name="email"
                       placeholder="Email"
                       required>

                <input type="password"
                       name="password"
                       placeholder="Password"
                       required>

                <button type="submit">
                    Create Account
                </button>

            </form>

            <div class="bottom-text">

                Already have an account?

                <a href="{% url 'login' %}">
                    Login
                </a>

            </div>

        </div>

    </div>

</div>

</body>
</html>
